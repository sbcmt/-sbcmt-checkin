<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>SBCMT 入場・受付管理</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background: #f4f4f4;
  color: #111;
}

.container {
  max-width: 650px;
  margin: 0 auto;
  padding: 25px 16px 50px;
}

.header {
  text-align: center;
}

h1 {
  margin: 0;
  font-size: 38px;
}

.subtitle {
  margin-top: 4px;
  color: #666;
  font-size: 16px;
}

#databaseStatus {
  margin-top: 18px;
  padding: 10px;
  border-radius: 10px;
  background: #e9e9e9;
  text-align: center;
  font-size: 13px;
}

.ready {
  color: #176b2c;
}

.errorStatus {
  color: #b00000;
}

.summary {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.summaryBox {
  flex: 1;
  padding: 12px 5px;
  background: white;
  border-radius: 12px;
  text-align: center;
}

.summaryLabel {
  color: #777;
  font-size: 12px;
}

.summaryNumber {

  font-size: 22px;
  font-weight: 800;
}

.tabs {
  display: flex;
  gap: 7px;
  margin-top: 20px;
}

.tabButton {
  flex: 1;
  padding: 14px 5px;
  border: none;
  border-radius: 12px;
  background: #ddd;
  color: #333;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.tabButton.active {

  color: white;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.modeTitle {
  margin-top: 25px;
  text-align: center;
  font-size: 28px;
  font-weight: 900;
}

.modeDescription {
  margin: 6px 0 20px;
  text-align: center;
  color: #666;
  font-size: 14px;
}

.scanButton {
  width: 100%;
  padding: 20px;
  border: none;
  border-radius: 16px;
  background: #111;
  color: white;
  font-size: 21px;
  font-weight: bold;
  cursor: pointer;
}

.scanButton:disabled {
  opacity: .4;
}

#reader {
  width: 100%;
  margin-top: 18px;
  overflow: hidden;
  border-radius: 16px;
}

#scanStatus {
  margin-top: 12px;
  text-align: center;
  color: #666;
  font-size: 15px;
}

#result {
  display: none;
  margin-top: 20px;
  padding: 25px 18px;
  background: white;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 4px 18px rgba(0,0,0,.10);
}

#completeMessage {
  margin-bottom: 22px;
  padding: 14px;
  border-radius: 12px;
  background: #e7f6ea;
  color: #176b2c;
  font-size: 30px;
  font-weight: 900;
}

#alreadyMessage {
  display: none;
  margin-bottom: 22px;
  padding: 14px;
  border-radius: 12px;
  background: #fff3cd;
  color: #795500;
  font-size: 25px;
  font-weight: 900;
}

.label {
  color: #777;
  font-size: 13px;
}

#resultName {
  margin-top: 3px;
  font-size: 32px;
  font-weight: 900;
}

.siteLabel {
  margin-top: 22px;
}

#resultSite {
  margin-top: 3px;
  font-size: 62px;
  line-height: 1;
  font-weight: 900;
}

#resultTime {
  margin-top: 22px;
  color: #666;
  font-size: 14px;
}

#error {
  display: none;
  margin-top: 18px;
  padding: 16px;
  background: white;
  border-radius: 14px;
  color: #b00000;
  text-align: center;
  font-weight: bold;
  white-space: pre-wrap;
}

#nextButton {
  display: none;
  width: 100%;
  margin-top: 14px;
  padding: 18px;
  border: none;
  border-radius: 14px;
  background: #555;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

.listControls {
  margin-top: 22px;
}

.searchInput {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 12px;
  background: white;
  font-size: 16px;
}

.filters {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}

.filterButton {
  flex: 1;
  padding: 10px 3px;
  border: none;
  border-radius: 9px;
  background: #ddd;
  font-size: 13px;
  font-weight: bold;
}

.filterButton.active {
  background: #111;
  color: white;
}

.tableWrap {
  margin-top: 15px;
  overflow-x: auto;
  background: white;
  border-radius: 14px;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 440px;
}

th {
  padding: 12px 7px;
  background: #eee;
  font-size: 13px;
  text-align: center;
}

td {
  padding: 13px 7px;
  border-top: 1px solid #eee;
  font-size: 14px;
}

td.nameCell {
  font-weight: 700;
}

td.center {
  text-align: center;
}

.markYes {
  color: #176b2c;
  font-size: 23px;
  font-weight: 900;
}

.markNo {
  color: #bbb;
  font-size: 18px;
}

.emptyMessage {
  padding: 30px;
  text-align: center;
  color: #777;
}

.adminArea {
  margin-top: 35px;
  padding-top: 20px;
  border-top: 1px solid #ccc;
}

.adminTitle {
  margin-bottom: 10px;
  text-align: center;
  color: #888;
  font-size: 12px;
}

.resetButton {
  width: 100%;
  padding: 14px;
  border: 1px solid #b00000;
  border-radius: 12px;
  background: white;
  color: #b00000;
  font-size: 15px;
  font-weight: bold;
}

.resetNote {
  margin-top: 8px;
  text-align: center;
  color: #999;
  font-size: 11px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>SBCMT</h1>
    <div class="subtitle">入場・受付管理</div>
  </div>

  <div id="databaseStatus">
    参加者リストを読み込んでいます…
  </div>

  <div class="summary">

    <div class="summaryBox">
      <div class="summaryLabel">参加者</div>
      <div class="summaryNumber" id="totalCount">0</div>
    </div>

    <div class="summaryBox">
      <div class="summaryLabel">入場</div>
      <div class="summaryNumber" id="entryCount">0</div>
    </div>

    <div class="summaryBox">
      <div class="summaryLabel">受付</div>
      <div class="summaryNumber" id="receptionCount">0</div>
    </div>

  </div>

  <div class="tabs">

    <button
      class="tabButton active"
      id="entryTab"
      onclick="changePage('entry')">
      入場
    </button>

    <button
      class="tabButton"
      id="receptionTab"
      onclick="changePage('reception')">
      受付
    </button>

    <button
      class="tabButton"
      id="listTab"
      onclick="changePage('list')">
      一覧
    </button>

  </div>


  <!-- 入場・受付 共通スキャン画面 -->

  <div id="scanPage" class="page active">

    <div class="modeTitle" id="modeTitle">
      入場
    </div>

    <div class="modeDescription" id="modeDescription">
      入場確認用QRを読み取ります
    </div>

    <button
      id="scanButton"
      class="scanButton"
      onclick="startScanner()"
      disabled>
      QRを読み取る
    </button>

    <div id="reader"></div>

    <div id="scanStatus"></div>

    <div id="result">

      <div id="completeMessage">
        入場完了
      </div>

      <div id="alreadyMessage">
        入場済み
      </div>

      <div class="label">
        名前
      </div>

      <div id="resultName"></div>

      <div class="label siteLabel">
        区画番号
      </div>

      <div id="resultSite"></div>

      <div id="resultTime"></div>

    </div>

    <div id="error"></div>

    <button
      id="nextButton"
      onclick="nextScan()">
      次のQRを読み取る
    </button>

  </div>


  <!-- 一覧 -->

  <div id="listPage" class="page">

    <div class="listControls">

      <input
        id="searchInput"
        class="searchInput"
        type="text"
        placeholder="名前・区画番号で検索"
        oninput="renderList()">

      <div class="filters">

        <button
          id="filterAll"
          class="filterButton active"
          onclick="setFilter('all')">
          全員
        </button>

        <button
          id="filterNotEntry"
          class="filterButton"
          onclick="setFilter('notEntry')">
          未入場
        </button>

        <button
          id="filterNotReception"
          class="filterButton"
          onclick="setFilter('notReception')">
          未受付
        </button>

      </div>

    </div>

    <div class="tableWrap">

      <table>

        <thead>
          <tr>
            <th>名前</th>
            <th>区画</th>
            <th>入場</th>
            <th>受付</th>
          </tr>
        </thead>

        <tbody id="participantTable">
        </tbody>

      </table>

      <div
        id="emptyMessage"
        class="emptyMessage"
        style="display:none;">
        該当者はいません
      </div>

    </div>

  </div>


  <!-- 管理 -->

  <div class="adminArea">

    <div class="adminTitle">
      管理
    </div>

    <button
      class="resetButton"
      onclick="resetAllRecords()">
      入場・受付記録をすべてリセット
    </button>

    <div class="resetNote">
      テスト終了後に使用してください。参加者リストは削除されません。
    </div>

  </div>

</div>


<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>

/* ================================
   基本設定
================================ */

let participants = {};

let currentMode = "entry";

let currentFilter = "all";

let html5QrCode = null;

let scannerRunning = false;

let alreadyRead = false;


/* ================================
   記録データ
================================ */

function getRecords() {

  try {

    const saved =
      localStorage.getItem(
        "sbcmtRecords"
      );

    if (!saved) {
      return {};
    }

    return JSON.parse(saved);

  } catch (error) {

    return {};

  }

}


function saveRecords(records) {

  localStorage.setItem(
    "sbcmtRecords",
    JSON.stringify(records)
  );

}


/* ================================
   CSV読込
================================ */

async function loadParticipants() {

  const status =
    document.getElementById(
      "databaseStatus"
    );

  try {

    const response =
      await fetch(
        "participants.csv?t=" +
        Date.now()
      );

    if (!response.ok) {

      throw new Error(
        "participants.csv を取得できません"
      );

    }

    const text =
      await response.text();

    parseCSV(text);

    const count =
      Object.keys(
        participants
      ).length;

    if (count === 0) {

      throw new Error(
        "参加者データが0件です"
      );

    }

    status.textContent =
      "参加者 " +
      count +
      "組 読み込み完了";

    status.className =
      "ready";

    document.getElementById(
      "scanButton"
    ).disabled = false;

    updateSummary();

    renderList();

  } catch (error) {

    status.textContent =
      "参加者リストを読み込めませんでした";

    status.className =
      "errorStatus";

    showError(
      "participants.csv の読み込みに失敗しました。\n\n" +
      String(error)
    );

  }

}


/* ================================
   CSV解析
================================ */

function parseCSV(text) {

  participants = {};

  text =
    text.replace(
      /^\uFEFF/,
      ""
    );

  const rows =
    text.split(/\r?\n/);

  if (rows.length < 2) {
    return;
  }

  const headers =
    parseCSVLine(
      rows[0]
    ).map(
      value =>
        value
        .trim()
        .toLowerCase()
    );

  const idIndex =
    headers.indexOf("id");

  const nameIndex =
    headers.indexOf("name");

  const siteIndex =
    headers.indexOf("site");

  if (
    idIndex === -1 ||
    nameIndex === -1 ||
    siteIndex === -1
  ) {

    throw new Error(
      "CSVの1行目は id,name,site にしてください"
    );

  }

  for (
    let i = 1;
    i < rows.length;
    i++
  ) {

    if (!rows[i].trim()) {
      continue;
    }

    const columns =
      parseCSVLine(
        rows[i]
      );

    const id =
      (
        columns[idIndex] ||
        ""
      ).trim();

    const name =
      (
        columns[nameIndex] ||
        ""
      ).trim();

    const site =
      (
        columns[siteIndex] ||
        ""
      ).trim();

    if (!id) {
      continue;
    }

    participants[id] = {
      id: id,
      name: name,
      site: site
    };

  }

}


function parseCSVLine(line) {

  const result = [];

  let current = "";

  let insideQuotes = false;

  for (
    let i = 0;
    i < line.length;
    i++
  ) {

    const char =
      line[i];

    if (char === '"') {

      if (
        insideQuotes &&
        line[i + 1] === '"'
      ) {

        current += '"';

        i++;

      } else {

        insideQuotes =
          !insideQuotes;

      }

    } else if (
      char === "," &&
      !insideQuotes
    ) {

      result.push(
        current
      );

      current = "";

    } else {

      current += char;

    }

  }

  result.push(
    current
  );

  return result;

}


/* ================================
   ページ切替
================================ */

async function changePage(page) {

  await stopScanner();

  clearScanScreen();

  document
    .querySelectorAll(
      ".tabButton"
    )
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );

  document
    .querySelectorAll(
      ".page"
    )
    .forEach(
      page =>
        page.classList.remove(
          "active"
        )
    );

  if (page === "entry") {

    currentMode =
      "entry";

    document.getElementById(
      "entryTab"
    ).classList.add(
      "active"
    );

    document.getElementById(
      "scanPage"
    ).classList.add(
      "active"
    );

    document.getElementById(
      "modeTitle"
    ).textContent =
      "入場";

    document.getElementById(
      "modeDescription"
    ).textContent =
      "入場確認用QRを読み取ります";

  }


  if (page === "reception") {

    currentMode =
      "reception";

    document.getElementById(
      "receptionTab"
    ).classList.add(
      "active"
    );

    document.getElementById(
      "scanPage"
    ).classList.add(
      "active"
    );

    document.getElementById(
      "modeTitle"
    ).textContent =
      "受付";

    document.getElementById(
      "modeDescription"
    ).textContent =
      "受付確認用QRを読み取ります";

  }


  if (page === "list") {

    document.getElementById(
      "listTab"
    ).classList.add(
      "active"
    );

    document.getElementById(
      "listPage"
    ).classList.add(
      "active"
    );

    renderList();

  }

}


/* ================================
   QR読取結果
================================ */

function lookupParticipant(
  rawId
) {

  const id =
    String(
      rawId
    ).trim();

  if (!participants[id]) {

    showError(
      "登録されていないQRコードです。\n\n" +
      "読取内容：\n" +
      id
    );

    stopScanner();

    document.getElementById(
      "nextButton"
    ).style.display =
      "block";

    return;

  }

  const person =
    participants[id];

  const records =
    getRecords();

  if (!records[id]) {

    records[id] = {
      entry: null,
      reception: null
    };

  }

  document.getElementById(
    "resultName"
  ).textContent =
    person.name;

  document.getElementById(
    "resultSite"
  ).textContent =
    person.site;

  document.getElementById(
    "error"
  ).style.display =
    "none";


  const existingTime =
    records[id][currentMode];


  if (existingTime) {

    document.getElementById(
      "completeMessage"
    ).style.display =
      "none";

    document.getElementById(
      "alreadyMessage"
    ).style.display =
      "block";

    document.getElementById(
      "alreadyMessage"
    ).textContent =
      currentMode === "entry"
      ? "入場済み"
      : "受付済み";

    document.getElementById(
      "resultTime"
    ).textContent =
      (
        currentMode === "entry"
        ? "入場時刻："
        : "受付時刻："
      ) +
      formatDateTime(
        existingTime
      );

    document.getElementById(
      "scanStatus"
    ).textContent =
      "このQRはすでに処理済みです";

  } else {

    const now =
      new Date().toISOString();

    records[id][currentMode] =
      now;

    saveRecords(
      records
    );

    document.getElementById(
      "completeMessage"
    ).style.display =
      "block";

    document.getElementById(
      "completeMessage"
    ).textContent =
      currentMode === "entry"
      ? "入場完了"
      : "受付完了";

    document.getElementById(
      "alreadyMessage"
    ).style.display =
      "none";

    document.getElementById(
      "resultTime"
    ).textContent =
      (
        currentMode === "entry"
        ? "入場時刻："
        : "受付時刻："
      ) +
      formatDateTime(
        now
      );

    document.getElementById(
      "scanStatus"
    ).textContent =
      currentMode === "entry"
      ? "入場登録しました"
      : "受付登録しました";

    updateSummary();

    renderList();

  }

  document.getElementById(
    "result"
  ).style.display =
    "block";

  document.getElementById(
    "nextButton"
  ).style.display =
    "block";

  stopScanner();

}


/* ================================
   集計
================================ */

function updateSummary() {

  const records =
    getRecords();

  const ids =
    Object.keys(
      participants
    );

  let entryCount = 0;

  let receptionCount = 0;

  ids.forEach(
    id => {

      if (
        records[id] &&
        records[id].entry
      ) {
        entryCount++;
      }

      if (
        records[id] &&
        records[id].reception
      ) {
        receptionCount++;
      }

    }
  );

  document.getElementById(
    "totalCount"
  ).textContent =
    ids.length;

  document.getElementById(
    "entryCount"
  ).textContent =
    entryCount;

  document.getElementById(
    "receptionCount"
  ).textContent =
    receptionCount;

}


/* ================================
   一覧表示
================================ */

function renderList() {

  const tbody =
    document.getElementById(
      "participantTable"
    );

  const empty =
    document.getElementById(
      "emptyMessage"
    );

  const search =
    (
      document.getElementById(
        "searchInput"
      ).value ||
      ""
    )
    .trim()
    .toLowerCase();

  const records =
    getRecords();

  tbody.innerHTML =
    "";

  let shown = 0;

  Object.keys(
    participants
  ).forEach(
    id => {

      const person =
        participants[id];

      const record =
        records[id] || {
          entry: null,
          reception: null
        };

      const searchable =
        (
          person.name +
          " " +
          person.site +
          " " +
          id
        ).toLowerCase();

      if (
        search &&
        !searchable.includes(
          search
        )
      ) {
        return;
      }

      if (
        currentFilter ===
        "notEntry" &&
        record.entry
      ) {
        return;
      }

      if (
        currentFilter ===
        "notReception" &&
        record.reception
      ) {
        return;
      }

      shown++;

      const tr =
        document.createElement(
          "tr"
        );

      const nameTd =
        document.createElement(
          "td"
        );

      nameTd.className =
        "nameCell";

      nameTd.textContent =
        person.name;


      const siteTd =
        document.createElement(
          "td"
        );

      siteTd.className =
        "center";

      siteTd.textContent =
        person.site;


      const entryTd =
        document.createElement(
          "td"
        );

      entryTd.className =
        "center " +
        (
          record.entry
          ? "markYes"
          : "markNo"
        );

      entryTd.textContent =
        record.entry
        ? "○"
        : "－";


      const receptionTd =
        document.createElement(
          "td"
        );

      receptionTd.className =
        "center " +
        (
          record.reception
          ? "markYes"
          : "markNo"
        );

      receptionTd.textContent =
        record.reception
        ? "○"
        : "－";


      tr.appendChild(
        nameTd
      );

      tr.appendChild(
        siteTd
      );

      tr.appendChild(
        entryTd
      );

      tr.appendChild(
        receptionTd
      );

      tbody.appendChild(
        tr
      );

    }
  );


  empty.style.display =
    shown === 0
    ? "block"
    : "none";

}


/* ================================
   一覧フィルター
================================ */

function setFilter(
  filter
) {

  currentFilter =
    filter;

  document
    .querySelectorAll(
      ".filterButton"
    )
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );


  if (
    filter === "all"
  ) {

    document.getElementById(
      "filterAll"
    ).classList.add(
      "active"
    );

  }


  if (
    filter === "notEntry"
  ) {

    document.getElementById(
      "filterNotEntry"
    ).classList.add(
      "active"
    );

  }


  if (
    filter === "notReception"
  ) {

    document.getElementById(
      "filterNotReception"
    ).classList.add(
      "active"
    );

  }


  renderList();

}


/* ================================
   日時
================================ */

function formatDateTime(
  isoString
) {

  const date =
    new Date(
      isoString
    );

  const month =
    date.getMonth() + 1;

  const day =
    date.getDate();

  const hour =
    String(
      date.getHours()
    ).padStart(
      2,
      "0"
    );

  const minute =
    String(
      date.getMinutes()
    ).padStart(
      2,
      "0"
    );

  return (
    month +
    "/" +
    day +
    " " +
    hour +
    ":" +
    minute
  );

}


/* ================================
   カメラ起動
================================ */

async function startScanner() {

  if (
    scannerRunning
  ) {
    return;
  }

  alreadyRead =
    false;

  clearScanScreen();

  document.getElementById(
    "scanStatus"
  ).textContent =
    "カメラを確認しています…";


  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    showError(
      "QR読取プログラムを読み込めませんでした。"
    );

    return;

  }


  try {

    const cameras =
      await Html5Qrcode
      .getCameras();

    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "使用できるカメラがありません"
      );

    }


    let selectedCamera =
      cameras[
        cameras.length - 1
      ].id;


    for (
      let i = 0;
      i < cameras.length;
      i++
    ) {

      const label =
        (
          cameras[i].label ||
          ""
        ).toLowerCase();

      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment") ||
        label.includes("背面")
      ) {

        selectedCamera =
          cameras[i].id;

        break;

      }

    }


    html5QrCode =
      new Html5Qrcode(
        "reader"
      );


    await html5QrCode.start(

      selectedCamera,

      {
        fps: 10
      },

      function(
        decodedText
      ) {

        if (
          alreadyRead
        ) {
          return;
        }

        alreadyRead =
          true;

        lookupParticipant(
          decodedText
        );

      },

      function(
        errorMessage
      ) {

      }

    );


    scannerRunning =
      true;


    document.getElementById(
      "scanStatus"
    ).textContent =
      currentMode === "entry"
      ? "入場QRを読み取ってください"
      : "受付QRを読み取ってください";


  } catch (
    error
  ) {

    scannerRunning =
      false;

    const detail =
      error &&
      (
        error.message ||
        error.name ||
        String(error)
      );

    showError(
      "カメラを起動できませんでした。\n\n" +
      "エラー内容：\n" +
      detail
    );

  }

}


/* ================================
   カメラ停止
================================ */

async function stopScanner() {

  if (!html5QrCode) {

    scannerRunning =
      false;

    return;

  }

  try {

    if (
      scannerRunning
    ) {

      await html5QrCode.stop();

    }

  } catch (error) {
  }

  try {

    html5QrCode.clear();

  } catch (error) {
  }

  html5QrCode =
    null;

  scannerRunning =
    false;

}


/* ================================
   次のQR
================================ */

async function nextScan() {

  await stopScanner();

  clearScanScreen();

  startScanner();

}


/* ================================
   表示リセット
================================ */

function clearScanScreen() {

  document.getElementById(
    "result"
  ).style.display =
    "none";

  document.getElementById(
    "error"
  ).style.display =
    "none";

  document.getElementById(
    "nextButton"
  ).style.display =
    "none";

  document.getElementById(
    "scanStatus"
  ).textContent =
    "";

}


/* ================================
   エラー
================================ */

function showError(
  message
) {

  document.getElementById(
    "error"
  ).textContent =
    message;

  document.getElementById(
    "error"
  ).style.display =
    "block";

  document.getElementById(
    "result"
  ).style.display =
    "none";

}


/* ================================
   全記録リセット
================================ */

async function resetAllRecords() {

  const records =
    getRecords();

  let recordCount = 0;

  Object.keys(
    records
  ).forEach(
    id => {

      if (
        records[id].entry ||
        records[id].reception
      ) {
        recordCount++;
      }

    }
  );


  if (
    recordCount === 0
  ) {

    alert(
      "現在、入場・受付記録はありません。"
    );

    return;

  }


  const first =
    confirm(
      "入場・受付記録をすべてリセットします。\n\n" +
      "テスト終了後以外は実行しないでください。\n\n" +
      "続けますか？"
    );


  if (!first) {
    return;
  }


  const second =
    confirm(
      "本当にすべての記録を削除しますか？\n\n" +
      "この操作は元に戻せません。"
    );


  if (!second) {
    return;
  }


  await stopScanner();


  localStorage.removeItem(
    "sbcmtRecords"
  );


  updateSummary();

  renderList();

  clearScanScreen();


  alert(
    "入場・受付記録をリセットしました。\n\n本番受付を開始できます。"
  );

}


/* ================================
   起動
================================ */

window.addEventListener(
  "DOMContentLoaded",
  function() {

    loadParticipants();

    updateSummary();

  }
);

</script>
