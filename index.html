<style>

#resultName {

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  update,
  remove
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* ===============================
   Firebase
================================ */

const firebaseConfig = {

  apiKey:
    "AIzaSyCyNyj4KLWxU7qSE8GB00kHVge_cZycQMU",

  authDomain:
    "sbcmt-checkin.firebaseapp.com",

  databaseURL:
    "https://sbcmt-checkin-default-rtdb.firebaseio.com",

  projectId:
    "sbcmt-checkin",

  storageBucket:
    "sbcmt-checkin.firebasestorage.app",

  messagingSenderId:
    "756110330252",

  appId:
    "1:756110330252:web:f6fa8855cbed56823eaea9",

  measurementId:
    "G-CETYTW1BCS"

};


const app = initializeApp(firebaseConfig);

const database = getDatabase(app);

const auth = getAuth(app);


/* ===============================
   データ
================================ */

let participants = {};
let sharedRecords = {};

let currentMode = "entry";
let currentFilter = "all";

let html5QrCode = null;
let scannerRunning = false;
let alreadyRead = false;
let firebaseConnected = false;

let attendanceListenerStarted = false;


/* ===============================
   ログイン状態
================================ */

onAuthStateChanged(auth, async user => {

  if (user) {

    document.getElementById("loginScreen").style.display =
      "none";

    document.getElementById("mainApp").style.display =
      "block";

    if (!attendanceListenerStarted) {

      startAttendanceListener();

      attendanceListenerStarted = true;

    }

    if (Object.keys(participants).length === 0) {

      await loadParticipants();

    }

  } else {

    await stopScanner();

    document.getElementById("loginScreen").style.display =
      "block";

    document.getElementById("mainApp").style.display =
      "none";

  }

});


/* ===============================
   ログイン
================================ */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const errorBox =
    document.getElementById("loginError");


  errorBox.style.display =
    "none";


  if (!email || !password) {

    errorBox.textContent =
      "メールアドレスとパスワードを入力してください。";

    errorBox.style.display =
      "block";

    return;

  }


  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    document.getElementById("password").value =
      "";

    } catch (error) {

    console.error(error);

    const errorCode =
      error && error.code
        ? error.code
        : "unknown-error";

    const explanations = {
      "auth/invalid-credential":
        "メールアドレスまたはパスワードがFirebaseの登録内容と一致していません。",

      "auth/user-disabled":
        "このユーザーは無効になっています。",

      "auth/too-many-requests":
        "ログイン試行が多いため、一時的に制限されています。",

      "auth/network-request-failed":
        "通信エラーです。インターネット接続を確認してください。",

      "auth/operation-not-allowed":
        "Firebaseでメール・パスワード認証が有効になっていません。",

      "auth/unauthorized-domain":
        "このWebサイトのドメインがFirebaseで許可されていません。",

      "auth/invalid-api-key":
        "FirebaseのAPIキー設定に問題があります。",

      "auth/invalid-email":
        "メールアドレスの形式が正しくありません。"
    };

    const explanation =
      explanations[errorCode] ||
      "Firebaseから返されたエラーコードを確認してください。";

    errorBox.textContent =
      "ログインできませんでした。\n\n" +
      "エラーコード：\n" +
      errorCode +
      "\n\n" +
      explanation;

    errorBox.style.whiteSpace =
      "pre-wrap";

    errorBox.style.display =
      "block";

  }

}


/* ===============================
   ログアウト
================================ */

async function logout() {

  const answer =
    confirm("ログアウトしますか？");

  if (!answer) return;

  await stopScanner();

  await signOut(auth);

}


/* ===============================
   Firebase接続状態
================================ */

const connectedRef =
  ref(database, ".info/connected");

onValue(connectedRef, snapshot => {

  firebaseConnected =
    snapshot.val() === true;

  const status =
    document.getElementById("firebaseStatus");

  if (!status) return;


  if (firebaseConnected) {

    status.textContent =
      "● 同期接続中";

    status.className =
      "firebaseOnline";

  } else {

    status.textContent =
      "● Firebase未接続";

    status.className =
      "firebaseOffline";

  }

});


/* ===============================
   リアルタイム同期
================================ */

function startAttendanceListener() {

  const recordsRef =
    ref(database, "attendance");


  onValue(

    recordsRef,

    snapshot => {

      sharedRecords =
        snapshot.val() || {};

      updateSummary();

      renderList();

    },

    error => {

      console.error(error);

      const status =
        document.getElementById("firebaseStatus");

      status.textContent =
        "Firebaseへのアクセスが拒否されました";

      status.className =
        "firebaseOffline";

    }

  );

}


/* ===============================
   CSV
================================ */

async function loadParticipants() {

  const status =
    document.getElementById("databaseStatus");

  try {

    const response =
      await fetch(
        "participants.csv?t=" +
        Date.now()
      );

    if (!response.ok) {

      throw new Error(
        "participants.csv を取得できません"
      );

    }


    const text =
      await response.text();

    parseCSV(text);


    const count =
      Object.keys(participants).length;


    if (count === 0) {

      throw new Error(
        "参加者データが0件です"
      );

    }


    status.textContent =
      "参加者 " +
      count +
      "組 読み込み完了";


    document.getElementById("scanButton").disabled =
      false;


    updateSummary();

    renderList();


  } catch (error) {

    status.textContent =
      "参加者リストを読み込めませんでした";

    showError(
      "participants.csv の読み込みに失敗しました。\n\n" +
      String(error)
    );

  }

}


function parseCSV(text) {

  participants = {};

  text =
    text.replace(/^\uFEFF/, "");

  const rows =
    text.split(/\r?\n/);

  if (rows.length < 2) return;


  const headers =
    parseCSVLine(rows[0]).map(
      value =>
        value.trim().toLowerCase()
    );


  const idIndex =
    headers.indexOf("id");

  const nameIndex =
    headers.indexOf("name");

  const siteIndex =
    headers.indexOf("site");


  if (
    idIndex === -1 ||
    nameIndex === -1 ||
    siteIndex === -1
  ) {

    throw new Error(
      "CSVの1行目は id,name,site にしてください"
    );

  }


  for (
    let i = 1;
    i < rows.length;
    i++
  ) {

    if (!rows[i].trim()) continue;


    const columns =
      parseCSVLine(rows[i]);


    const id =
      (columns[idIndex] || "").trim();

    const name =
      (columns[nameIndex] || "").trim();

    const site =
      (columns[siteIndex] || "").trim();


    if (!id) continue;


    participants[id] = {
      id,
      name,
      site
    };

  }

}


function parseCSVLine(line) {

  const result = [];

  let current = "";

  let insideQuotes = false;


  for (
    let i = 0;
    i < line.length;
    i++
  ) {

    const char =
      line[i];


    if (char === '"') {

      if (
        insideQuotes &&
        line[i + 1] === '"'
      ) {

        current += '"';

        i++;

      } else {

        insideQuotes =
          !insideQuotes;

      }

    } else if (
      char === "," &&
      !insideQuotes
    ) {

      result.push(current);

      current = "";

    } else {

      current += char;

    }

  }


  result.push(current);

  return result;

}


/* ===============================
   ページ切替
================================ */

async function changePage(page) {

  await stopScanner();

  clearScanScreen();


  document
    .querySelectorAll(".tabButton")
    .forEach(
      button =>
        button.classList.remove("active")
    );


  document
    .querySelectorAll(".page")
    .forEach(
      element =>
        element.classList.remove("active")
    );


  if (page === "entry") {

    currentMode =
      "entry";

    document
      .getElementById("entryTab")
      .classList.add("active");

    document
      .getElementById("scanPage")
      .classList.add("active");

    document.getElementById("modeTitle").textContent =
      "入場";

    document.getElementById("modeDescription").textContent =
      "入場する方のQRを読み取ります";

  }


  if (page === "reception") {

    currentMode =
      "reception";

    document
      .getElementById("receptionTab")
      .classList.add("active");

    document
      .getElementById("scanPage")
      .classList.add("active");

    document.getElementById("modeTitle").textContent =
      "受付";

    document.getElementById("modeDescription").textContent =
      "受付する方のQRを読み取ります";

  }


  if (page === "list") {

    document
      .getElementById("listTab")
      .classList.add("active");

    document
      .getElementById("listPage")
      .classList.add("active");

    renderList();

  }

}


/* ===============================
   QR処理
================================ */

async function lookupParticipant(rawId) {

  const id =
    String(rawId).trim();


  if (!participants[id]) {

    showError(
      "登録されていないQRコードです。\n\n" +
      "読取内容：\n" +
      id
    );

    await stopScanner();

    document.getElementById("nextButton").style.display =
      "block";

    return;

  }


  if (!auth.currentUser) {

    showError(
      "ログイン状態を確認できませんでした。"
    );

    await stopScanner();

    return;

  }


  if (!firebaseConnected) {

    showError(
      "Firebaseに接続できていません。\n\n" +
      "通信状態を確認してください。"
    );

    await stopScanner();

    document.getElementById("nextButton").style.display =
      "block";

    return;

  }


  const person =
    participants[id];

  const record =
    sharedRecords[id] || {};


  document.getElementById("resultName").textContent =
    person.name;

  document.getElementById("resultSite").textContent =
    person.site || "未設定";

  document.getElementById("error").style.display =
    "none";


  const existingTime =
    record[currentMode];


  if (existingTime) {

    document.getElementById("completeMessage").style.display =
      "none";

    document.getElementById("alreadyMessage").style.display =
      "block";

    document.getElementById("alreadyMessage").textContent =
      currentMode === "entry"
        ? "入場済み"
        : "受付済み";

    document.getElementById("resultTime").textContent =
      (
        currentMode === "entry"
          ? "入場時刻："
          : "受付時刻："
      ) +
      formatDateTime(existingTime);

    document.getElementById("scanStatus").textContent =
      "このQRはすでに処理済みです";


  } else {

    try {

      const now =
        Date.now();

      const updates = {};


      updates[
        "attendance/" +
        id +
        "/" +
        currentMode
      ] = now;


      await update(
        ref(database),
        updates
      );


      document.getElementById("completeMessage").style.display =
        "block";

      document.getElementById("completeMessage").textContent =
        currentMode === "entry"
          ? "入場完了"
          : "受付完了";


      document.getElementById("alreadyMessage").style.display =
        "none";


      document.getElementById("resultTime").textContent =
        (
          currentMode === "entry"
            ? "入場時刻："
            : "受付時刻："
        ) +
        formatDateTime(now);


      document.getElementById("scanStatus").textContent =
        currentMode === "entry"
          ? "入場登録しました"
          : "受付登録しました";


    } catch (error) {

      console.error(error);

      showError(
        "Firebaseへの保存に失敗しました。\n\n" +
        "ログイン状態または通信状態を確認してください。"
      );

      await stopScanner();

      document.getElementById("nextButton").style.display =
        "block";

      return;

    }

  }


  document.getElementById("result").style.display =
    "block";

  document.getElementById("nextButton").style.display =
    "block";

  await stopScanner();

}


/* ===============================
   集計
================================ */

function updateSummary() {

  const ids =
    Object.keys(participants);

  let entryCount = 0;

  let receptionCount = 0;


  ids.forEach(id => {

    const record =
      sharedRecords[id] || {};

    if (record.entry) {
      entryCount++;
    }

    if (record.reception) {
      receptionCount++;
    }

  });


  document.getElementById("totalCount").textContent =
    ids.length;

  document.getElementById("entryCount").textContent =
    entryCount;

  document.getElementById("receptionCount").textContent =
    receptionCount;

}


/* ===============================
   一覧
================================ */

function renderList() {

  const tbody =
    document.getElementById("participantTable");

  if (!tbody) return;


  const empty =
    document.getElementById("emptyMessage");


  const search =
    (
      document.getElementById("searchInput").value || ""
    )
    .trim()
    .toLowerCase();


  tbody.innerHTML = "";

  let shown = 0;


  Object.keys(participants).forEach(id => {

    const person =
      participants[id];

    const record =
      sharedRecords[id] || {};


    const searchable =
      (
        person.name +
        " " +
        person.site +
        " " +
        id
      ).toLowerCase();


    if (
      search &&
      !searchable.includes(search)
    ) {
      return;
    }


    if (
      currentFilter === "notEntry" &&
      record.entry
    ) {
      return;
    }


    if (
      currentFilter === "notReception" &&
      record.reception
    ) {
      return;
    }


    shown++;


    const tr =
      document.createElement("tr");


    const nameTd =
      document.createElement("td");

    nameTd.className =
      "nameCell";

    nameTd.textContent =
      person.name;


    const siteTd =
      document.createElement("td");

    siteTd.className =
      "center";

    siteTd.textContent =
      person.site || "－";


    const entryTd =
      document.createElement("td");

    entryTd.className =
      "center " +
      (
        record.entry
          ? "markYes"
          : "markNo"
      );

    entryTd.textContent =
      record.entry
        ? "○"
        : "－";


    const receptionTd =
      document.createElement("td");

    receptionTd.className =
      "center " +
      (
        record.reception
          ? "markYes"
          : "markNo"
      );

    receptionTd.textContent =
      record.reception
        ? "○"
        : "－";


    tr.appendChild(nameTd);
    tr.appendChild(siteTd);
    tr.appendChild(entryTd);
    tr.appendChild(receptionTd);

    tbody.appendChild(tr);

  });


  empty.style.display =
    shown === 0
      ? "block"
      : "none";

}


/* ===============================
   フィルター
================================ */

function setFilter(filter) {

  currentFilter =
    filter;


  document
    .querySelectorAll(".filterButton")
    .forEach(
      button =>
        button.classList.remove("active")
    );


  if (filter === "all") {

    document
      .getElementById("filterAll")
      .classList.add("active");

  }


  if (filter === "notEntry") {

    document
      .getElementById("filterNotEntry")
      .classList.add("active");

  }


  if (filter === "notReception") {

    document
      .getElementById("filterNotReception")
      .classList.add("active");

  }


  renderList();

}


/* ===============================
   日時
================================ */

function formatDateTime(value) {

  const date =
    new Date(value);

  const month =
    date.getMonth() + 1;

  const day =
    date.getDate();

  const hour =
    String(
      date.getHours()
    ).padStart(2, "0");

  const minute =
    String(
      date.getMinutes()
    ).padStart(2, "0");


  return (
    month +
    "/" +
    day +
    " " +
    hour +
    ":" +
    minute
  );

}


/* ===============================
   カメラ
================================ */

async function startScanner() {

  if (scannerRunning) return;


  alreadyRead =
    false;

  clearScanScreen();


  document.getElementById("scanStatus").textContent =
    "カメラを確認しています…";


  if (
    typeof Html5Qrcode === "undefined"
  ) {

    showError(
      "QR読取プログラムを読み込めませんでした。"
    );

    return;

  }


  try {

    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "使用できるカメラがありません"
      );

    }


    let selectedCamera =
      cameras[cameras.length - 1].id;


    for (
      let i = 0;
      i < cameras.length;
      i++
    ) {

      const label =
        (
          cameras[i].label || ""
        ).toLowerCase();


      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment") ||
        label.includes("背面")
      ) {

        selectedCamera =
          cameras[i].id;

        break;

      }

    }


    html5QrCode =
      new Html5Qrcode("reader");


    scannerRunning =
      true;


    await html5QrCode.start(

      selectedCamera,

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },

      function(decodedText) {

        if (alreadyRead) return;

        alreadyRead =
          true;

        lookupParticipant(
          decodedText
        );

      },

      function() {}

    );


    document.getElementById("scanStatus").textContent =
      currentMode === "entry"
        ? "入場QRを読み取ってください"
        : "受付QRを読み取ってください";


  } catch (error) {

    scannerRunning =
      false;


    const detail =
      error &&
      (
        error.message ||
        error.name ||
        String(error)
      );


    showError(
      "カメラを起動できませんでした。\n\n" +
      "エラー内容：\n" +
      detail
    );

  }

}


/* ===============================
   カメラ停止
================================ */

async function stopScanner() {

  if (!html5QrCode) {

    scannerRunning =
      false;

    return;

  }


  try {

    if (scannerRunning) {

      await html5QrCode.stop();

    }

  } catch (error) {}


  try {

    html5QrCode.clear();

  } catch (error) {}


  html5QrCode =
    null;

  scannerRunning =
    false;

}


/* ===============================
   次のQR
================================ */

async function nextScan() {

  await stopScanner();

  clearScanScreen();

  startScanner();

}


/* ===============================
   表示クリア
================================ */

function clearScanScreen() {

  document.getElementById("result").style.display =
    "none";

  document.getElementById("error").style.display =
    "none";

  document.getElementById("nextButton").style.display =
    "none";

  document.getElementById("scanStatus").textContent =
    "";

}


/* ===============================
   エラー
================================ */

function showError(message) {

  document.getElementById("error").textContent =
    message;

  document.getElementById("error").style.display =
    "block";

  document.getElementById("result").style.display =
    "none";

}


/* ===============================
   全リセット
================================ */

async function resetAllRecords() {

  const count =
    Object.keys(sharedRecords).length;


  if (count === 0) {

    alert(
      "現在、入場・受付記録はありません。"
    );

    return;

  }


  const first =
    confirm(
      "Firebaseに保存されている入場・受付記録をすべてリセットします。\n\n" +
      "iPhone・iPad両方の記録が消えます。\n\n" +
      "続けますか？"
    );


  if (!first) return;


  const second =
    confirm(
      "本当にすべて削除しますか？\n\n" +
      "この操作は元に戻せません。"
    );


  if (!second) return;


  try {

    await stopScanner();


    await remove(
      ref(
        database,
        "attendance"
      )
    );


    clearScanScreen();


    alert(
      "入場・受付記録をすべてリセットしました。"
    );


  } catch (error) {

    alert(
      "リセットに失敗しました。\n\n" +
      "ログイン状態を確認してください。"
    );

  }

}

   HTMLから呼び出し
================================ */

  login;

window.logout =
  logout;

window.changePage =
  changePage;

window.startScanner =
  startScanner;

window.nextScan =
  nextScan;

window.setFilter =
  setFilter;

window.renderList =
  renderList;

window.resetAllRecords =
  resetAllRecords;

</script>
