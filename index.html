<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>SBCMT QR受付</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background: #f4f4f4;
  color: #111;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 35px 20px;
  text-align: center;
}

h1 {
  margin: 0;
  font-size: 38px;
}

.subtitle {
  margin-top: 5px;
  margin-bottom: 20px;
  color: #666;
  font-size: 17px;
}

#databaseStatus {
  margin-bottom: 25px;
  padding: 12px;
  border-radius: 12px;
  background: #e9e9e9;
  font-size: 14px;
}

.ready {
  color: #176b2c;
}

.errorStatus {
  color: #b00000;
}

button {
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 22px;
  background: #111;
  color: white;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .4;
}

#reader {
  width: 100%;
  margin-top: 20px;
  border-radius: 16px;
  overflow: hidden;
}

#status {
  margin-top: 15px;
  font-size: 16px;
  color: #666;
  white-space: pre-wrap;
}

#result {
  display: none;
  margin-top: 25px;
  padding: 30px 20px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 18px rgba(0,0,0,.12);
}

.label {
  font-size: 15px;
  color: #777;
}

#name {
  margin-top: 5px;
  font-size: 36px;
  font-weight: 800;
  word-break: break-word;
}

.site-label {
  margin-top: 30px;
}

#site {
  margin-top: 5px;
  font-size: 72px;
  line-height: 1;
  font-weight: 900;
}

#error {
  display: none;
  margin-top: 20px;
  padding: 18px;
  background: white;
  border-radius: 16px;
  color: #c00000;
  font-size: 17px;
  font-weight: bold;
  white-space: pre-wrap;
  word-break: break-word;
}

#nextButton {
  display: none;
  margin-top: 20px;
  background: #555;
}
</style>
</head>

<body>

<div class="container">

  <h1>SBCMT</h1>
  <div class="subtitle">QR受付システム</div>

  <div id="databaseStatus">
    参加者リストを読み込んでいます…
  </div>

  <button id="scanButton" onclick="startScanner()" disabled>
    QRを読み取る
  </button>

  <div id="reader"></div>

  <div id="status"></div>

  <div id="result">

    <div class="label">名前</div>
    <div id="name"></div>

    <div class="label site-label">区画番号</div>
    <div id="site"></div>

  </div>

  <div id="error"></div>

  <button id="nextButton" onclick="resetScanner()">
    次の受付
  </button>

</div>


<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>

/* =====================================
   参加者データ
===================================== */

let participants = {};

let html5QrCode = null;
let scannerRunning = false;
let alreadyRead = false;


/* =====================================
   CSV読み込み
===================================== */

async function loadParticipants() {

  const databaseStatus =
    document.getElementById("databaseStatus");

  const scanButton =
    document.getElementById("scanButton");

  try {

    /*
      ?t= を付けることで
      CSV更新時のキャッシュ問題を防ぎます
    */

    const response = await fetch(
      "participants.csv?t=" + Date.now()
    );

    if (!response.ok) {
      throw new Error(
        "participants.csv を取得できません"
      );
    }

    const text = await response.text();

    parseCSV(text);

    const count =
      Object.keys(participants).length;

    if (count === 0) {
      throw new Error(
        "参加者データが0件です"
      );
    }

    databaseStatus.textContent =
      "参加者 " + count + "組 読み込み完了";

    databaseStatus.className =
      "ready";

    scanButton.disabled = false;

  } catch (error) {

    databaseStatus.textContent =
      "参加者リストを読み込めませんでした";

    databaseStatus.className =
      "errorStatus";

    showError(
      "participants.csv の読み込みに失敗しました。\n\n" +
      String(error)
    );

  }

}


/* =====================================
   CSV解析
===================================== */

function parseCSV(text) {

  participants = {};

  /*
    BOM除去
  */

  text = text.replace(/^\uFEFF/, "");

  const rows =
    text.split(/\r?\n/);

  if (rows.length < 2) {
    return;
  }

  const headers =
    parseCSVLine(rows[0]).map(
      value => value.trim().toLowerCase()
    );

  const idIndex =
    headers.indexOf("id");

  const nameIndex =
    headers.indexOf("name");

  const siteIndex =
    headers.indexOf("site");


  if (
    idIndex === -1 ||
    nameIndex === -1 ||
    siteIndex === -1
  ) {

    throw new Error(
      "CSVの1行目は id,name,site にしてください"
    );

  }


  for (
    let i = 1;
    i < rows.length;
    i++
  ) {

    if (!rows[i].trim()) {
      continue;
    }

    const columns =
      parseCSVLine(rows[i]);

    const id =
      (columns[idIndex] || "").trim();

    const name =
      (columns[nameIndex] || "").trim();

    const site =
      (columns[siteIndex] || "").trim();


    if (!id) {
      continue;
    }


    participants[id] = {
      name: name,
      site: site
    };

  }

}


/* =====================================
   CSV 1行解析
   カンマ・ダブルクォート対応
===================================== */

function parseCSVLine(line) {

  const result = [];

  let current = "";
  let insideQuotes = false;


  for (
    let i = 0;
    i < line.length;
    i++
  ) {

    const char = line[i];


    if (char === '"') {

      if (
        insideQuotes &&
        line[i + 1] === '"'
      ) {

        current += '"';
        i++;

      } else {

        insideQuotes =
          !insideQuotes;

      }

    } else if (
      char === "," &&
      !insideQuotes
    ) {

      result.push(current);
      current = "";

    } else {

      current += char;

    }

  }


  result.push(current);

  return result;

}


/* =====================================
   QR照合
===================================== */

function lookupParticipant(rawId) {

  const id =
    String(rawId).trim();

  if (!participants[id]) {

    showError(
      "登録されていないQRコードです。\n\n" +
      "読取内容：\n" +
      id
    );

    stopScanner();

    return;
  }


  const person =
    participants[id];


  document.getElementById("name")
    .textContent =
    person.name;


  document.getElementById("site")
    .textContent =
    person.site;


  document.getElementById("result")
    .style.display =
    "block";


  document.getElementById("error")
    .style.display =
    "none";


  document.getElementById("nextButton")
    .style.display =
    "block";


  document.getElementById("status")
    .textContent =
    "受付QRを読み取りました";


  stopScanner();

}


/* =====================================
   エラー表示
===================================== */

function showError(message) {

  const box =
    document.getElementById("error");

  box.textContent =
    message;

  box.style.display =
    "block";


  document.getElementById("result")
    .style.display =
    "none";

}


/* =====================================
   カメラ起動
===================================== */

async function startScanner() {

  if (scannerRunning) {
    return;
  }


  alreadyRead = false;


  document.getElementById("result")
    .style.display =
    "none";


  document.getElementById("error")
    .style.display =
    "none";


  document.getElementById("nextButton")
    .style.display =
    "none";


  document.getElementById("status")
    .textContent =
    "カメラを確認しています…";


  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    showError(
      "QR読取プログラムを読み込めませんでした。"
    );

    return;

  }


  try {

    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "使用できるカメラがありません"
      );

    }


    let selectedCamera =
      cameras[cameras.length - 1].id;


    for (
      let i = 0;
      i < cameras.length;
      i++
    ) {

      const label =
        (cameras[i].label || "")
        .toLowerCase();


      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment") ||
        label.includes("背面")
      ) {

        selectedCamera =
          cameras[i].id;

        break;

      }

    }


    html5QrCode =
      new Html5Qrcode("reader");


    await html5QrCode.start(

      selectedCamera,

      {
        fps: 10
      },

      function(decodedText) {

        if (alreadyRead) {
          return;
        }

        alreadyRead = true;

        lookupParticipant(
          decodedText
        );

      },

      function(errorMessage) {

        /*
        読取待機中の通常エラー
        */

      }

    );


    scannerRunning = true;


    document.getElementById("status")
      .textContent =
      "QRコードをカメラに映してください";


  } catch (error) {

    scannerRunning = false;


    let detail =
      error &&
      (
        error.message ||
        error.name ||
        String(error)
      );


    showError(
      "カメラを起動できませんでした。\n\n" +
      "エラー内容：\n" +
      detail
    );

  }

}


/* =====================================
   カメラ停止
===================================== */

async function stopScanner() {

  if (!html5QrCode) {

    scannerRunning =
      false;

    return;

  }


  try {

    if (scannerRunning) {

      await html5QrCode.stop();

    }

  } catch (error) {
  }


  try {

    html5QrCode.clear();

  } catch (error) {
  }


  html5QrCode =
    null;

  scannerRunning =
    false;

}


/* =====================================
   次の受付
===================================== */

async function resetScanner() {

  await stopScanner();


  document.getElementById("result")
    .style.display =
    "none";


  document.getElementById("error")
    .style.display =
    "none";


  document.getElementById("nextButton")
    .style.display =
    "none";


  document.getElementById("status")
    .textContent =
    "";


  startScanner();

}


/* =====================================
   起動時
===================================== */

window.addEventListener(
  "DOMContentLoaded",
  loadParticipants
);

</script>

</body>
</html>
