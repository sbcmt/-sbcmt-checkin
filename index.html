<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>SBCMT QR受付</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background: #f4f4f4;
  color: #111;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 35px 20px;
  text-align: center;
}

h1 {
  margin: 0;
  font-size: 38px;
}

.subtitle {
  margin-top: 5px;
  margin-bottom: 35px;
  color: #666;
  font-size: 17px;
}

button {
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 22px;
  background: #111;
  color: white;
  font-size: 22px;
  font-weight: bold;
}

#reader {
  width: 100%;
  margin-top: 20px;
  border-radius: 16px;
  overflow: hidden;
}

#status {
  margin-top: 15px;
  font-size: 16px;
  color: #666;
  white-space: pre-wrap;
}

#result {
  display: none;
  margin-top: 25px;
  padding: 30px 20px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 18px rgba(0,0,0,.12);
}

.label {
  font-size: 15px;
  color: #777;
}

#name {
  margin-top: 5px;
  font-size: 36px;
  font-weight: 800;
}

.site-label {
  margin-top: 30px;
}

#site {
  margin-top: 5px;
  font-size: 72px;
  line-height: 1;
  font-weight: 900;
}

#error {
  display: none;
  margin-top: 20px;
  padding: 18px;
  background: white;
  border-radius: 16px;
  color: #c00000;
  font-size: 17px;
  font-weight: bold;
  white-space: pre-wrap;
  word-break: break-word;
}

#nextButton {
  display: none;
  margin-top: 20px;
  background: #555;
}

.test-area {
  margin-top: 40px;
  padding-top: 25px;
  border-top: 1px solid #ddd;
}

.test-title {
  color: #888;
  font-size: 13px;
  margin-bottom: 10px;
}

#testButton {
  background: white;
  color: #333;
  border: 1px solid #ccc;
  font-size: 16px;
  padding: 15px;
}
</style>
</head>

<body>

<div class="container">

<h1>SBCMT</h1>
<div class="subtitle">QR受付システム</div>

<button id="scanButton" onclick="startScanner()">
QRを読み取る
</button>

<div id="reader"></div>

<div id="status"></div>

<div id="result">

  <div class="label">名前</div>
  <div id="name"></div>

  <div class="label site-label">区画番号</div>
  <div id="site"></div>

</div>

<div id="error"></div>

<button id="nextButton" onclick="resetScanner()">
次の受付
</button>

<div class="test-area">

  <div class="test-title">
  動作確認用
  </div>

  <button id="testButton" onclick="lookupParticipant('SBCMT-001')">
  SBCMT-001 をテスト
  </button>

</div>

</div>


<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>

/* ==============================
   参加者データ
   ============================== */

const participants = {

  "SBCMT-001": {
    name: "小森様",
    site: "001"
  },

  "SBCMT-002": {
    name: "テスト山田様",
    site: "002"
  },

  "SBCMT-003": {
    name: "テスト佐藤様",
    site: "003"
  }

};


/* ==============================
   基本処理
   ============================== */

let html5QrCode = null;
let scannerRunning = false;
let alreadyRead = false;


function lookupParticipant(rawId) {

  const id = String(rawId).trim();

  if (!participants[id]) {

    showError(
      "登録されていないQRコードです。\n\n読取内容：\n" + id
    );

    stopScanner();

    return;
  }

  const person = participants[id];

  document.getElementById("name").textContent =
    person.name;

  document.getElementById("site").textContent =
    person.site;

  document.getElementById("result").style.display =
    "block";

  document.getElementById("error").style.display =
    "none";

  document.getElementById("nextButton").style.display =
    "block";

  document.getElementById("status").textContent =
    "受付QRを読み取りました";

  stopScanner();
}


function showError(message) {

  const box =
    document.getElementById("error");

  box.textContent = message;
  box.style.display = "block";

  document.getElementById("result").style.display =
    "none";

  document.getElementById("nextButton").style.display =
    "block";
}


/* ==============================
   カメラ起動
   ============================== */

async function startScanner() {

  if (scannerRunning) {
    return;
  }

  alreadyRead = false;

  document.getElementById("result").style.display =
    "none";

  document.getElementById("error").style.display =
    "none";

  document.getElementById("nextButton").style.display =
    "none";

  document.getElementById("status").textContent =
    "カメラを確認しています…";


  if (typeof Html5Qrcode === "undefined") {

    showError(
      "QR読取プログラムを読み込めませんでした。\n" +
      "インターネット接続を確認してください。"
    );

    return;
  }


  try {

    const cameras =
      await Html5Qrcode.getCameras();

    if (!cameras || cameras.length === 0) {

      showError(
        "使用できるカメラが見つかりませんでした。"
      );

      return;
    }


    /*
      iPhoneでは通常、
      カメラ一覧の最後側が背面カメラになります。
    */

    let selectedCamera =
      cameras[cameras.length - 1].id;


    for (let i = 0; i < cameras.length; i++) {

      const label =
        (cameras[i].label || "").toLowerCase();

      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment") ||
        label.includes("背面")
      ) {

        selectedCamera =
          cameras[i].id;

        break;
      }
    }


    html5QrCode =
      new Html5Qrcode("reader");


    document.getElementById("status").textContent =
      "カメラを起動しています…";


    await html5QrCode.start(

      selectedCamera,

      {
        fps: 10
      },

      function(decodedText) {

        if (alreadyRead) {
          return;
        }

        alreadyRead = true;

        lookupParticipant(decodedText);

      },

      function(errorMessage) {

        /*
        QRを探している最中に発生する
        通常のエラーなので何もしない
        */

      }

    );


    scannerRunning = true;

    document.getElementById("status").textContent =
      "QRコードをカメラに映してください";


  } catch (error) {

    scannerRunning = false;

    let detail = "";

    if (error) {
      detail =
        error.message ||
        error.name ||
        String(error);
    }

    showError(
      "カメラを起動できませんでした。\n\n" +
      "エラー内容：\n" +
      detail
    );

  }

}


/* ==============================
   カメラ停止
   ============================== */

async function stopScanner() {

  if (!html5QrCode) {
    scannerRunning = false;
    return;
  }

  try {

    if (scannerRunning) {
      await html5QrCode.stop();
    }

  } catch (error) {
  }

  try {
    html5QrCode.clear();
  } catch (error) {
  }

  html5QrCode = null;
  scannerRunning = false;

}


/* ==============================
   次の受付
   ============================== */

async function resetScanner() {

  await stopScanner();

  document.getElementById("result").style.display =
    "none";

  document.getElementById("error").style.display =
    "none";

  document.getElementById("nextButton").style.display =
    "none";

  document.getElementById("status").textContent =
    "";

  startScanner();

}

</script>

</body>
</html>
